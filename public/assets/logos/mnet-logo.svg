<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rocket Body -->
  <path d="M100 40 L140 120 L100 160 L60 120 Z" fill="url(#rocketGradient)" stroke="url(#borderGradient)" stroke-width="2"/>
  
  <!-- Rocket Window -->
  <circle cx="100" cy="90" r="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  
  <!-- Rocket Trajectory/Exhaust -->
  <ellipse cx="100" cy="170" rx="25" ry="15" fill="url(#exhaustGradient)" opacity="0.8" transform="rotate(15 100 170)"/>
  
  <!-- Rocket Fins -->
  <path d="M60 120 L50 140 L70 140 Z" fill="url(#finGradient)"/>
  <path d="M140 120 L150 140 L130 140 Z" fill="url(#finGradient)"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="rocketGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    
    <linearGradient id="exhaustGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="50%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    
    <linearGradient id="finGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#475569"/>
    </linearGradient>
  </defs>
</svg>
